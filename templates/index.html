<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>PhishGuard</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >

</head>


<body>

    <div class="container">

        <!-- HEADER -->
        <header>

            <h1>🛡️ PhishGuard</h1>

            <p>
                Real-Time Phishing Attack Detection
                and URL Analysis Tool
            </p>

        </header>


        <!-- SCANNER -->
        <section class="scanner">

            <h2>Scan a URL</h2>

            <p class="description">
                Enter a URL below to analyze its
                security characteristics.
            </p>


            <div class="input-area">

                <input
                    type="text"
                    id="urlInput"
                    placeholder="https://example.com"
                >

                <button id="scanButton">
                    Scan URL
                </button>

            </div>


            <p id="errorMessage"></p>

        </section>


        <!-- RESULT -->
        <section
    id="resultSection"
    class="result hidden"
>

    <h2>Scan Result</h2>

    <!-- VERDICT -->
    <div class="verdict-card">

        <div class="verdict-title">
            <span id="verdictIcon">⚠️</span>

            <span id="resultVerdict">
                SUSPICIOUS
            </span>
        </div>

        <div class="risk-score">

            <span id="resultScore">
                0/100
            </span>

        </div>

        <div class="risk-bar">

            <div
                id="riskBar"
                class="risk-bar-fill"
            ></div>

        </div>

        <p id="resultVerdictMessage"></p>

    </div>


    <!-- URL INFORMATION -->
    <div class="info-card">

        <h3>🔗 URL Information</h3>

        <div class="info-grid">

            <div class="info-item">

                <span>URL</span>

                <strong id="resultUrl"></strong>

            </div>


            <div class="info-item">

                <span>Domain</span>

                <strong id="resultDomain"></strong>

            </div>


            <div class="info-item">

                <span>Protocol</span>

                <strong id="resultProtocol"></strong>

            </div>


            <div class="info-item">

                <span>Path</span>

                <strong id="resultPath"></strong>

            </div>


            <div class="info-item">

                <span>URL Length</span>

                <strong id="resultLength"></strong>

            </div>

        </div>

    </div>


    <!-- RISK FACTORS -->
    <div class="info-card">

        <h3>🔍 Risk Factors</h3>

        <div id="riskFactors"></div>

    </div>


    <!-- ANALYSIS -->
    <div class="info-card">

        <h3>📝 Analysis</h3>

        <div id="resultReason"></div>

    </div>

</section>

    </div>


    <script
        src="{{ url_for('static', filename='script.js') }}"
    ></script>

</body>

</html>
